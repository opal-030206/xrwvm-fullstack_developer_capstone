name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  frontend:
    name: React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Upload bundle
        uses: actions/upload-artifact@v5
        with:
          name: react-dist
          path: server/frontend/dist

  backend:
    name: Django tests
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The React bundle is not committed, so pull the build from the frontend
      # job - exactly what a real deploy does before collectstatic runs.
      - name: Download React bundle
        uses: actions/download-artifact@v5
        with:
          name: react-dist
          path: server/frontend/dist

      # In production (DEBUG=0) static files are served through WhiteNoise's
      # hashed manifest, so collect them before rendering any page in a test.
      - name: Collect static files
        run: python manage.py collectstatic --noinput
        env:
          CAR_DEALERSHIP_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key

      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR
        env:
          CAR_DEALERSHIP_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key

      - name: Run test suite
        run: python manage.py test server.djangoapp -v 2
        env:
          CAR_DEALERSHIP_DEBUG: "0"
          DJANGO_SECRET_KEY: ci-only-secret-key

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Build Django image
        run: docker build -t cars-dealership:${{ github.sha }} .

      - name: Build sentiment image
        run: docker build -f Dockerfile.sentiment -t cars-dealership-sentiment:${{ github.sha }} .

      - name: Smoke test the Django image
        run: |
          docker network create capstone
          docker run -d --name sentiment --network capstone cars-dealership-sentiment:${{ github.sha }}
          docker run -d --name web --network capstone -p 8080:8080 \
            -e SENTIMENT_SERVICE_URL=http://sentiment:8080 cars-dealership:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/djangoapp/get_dealers >/dev/null; then
              echo "API is up"; break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8080/djangoapp/get_dealers | head -c 200
          curl -fsS -X POST http://localhost:8080/djangoapp/analyze_review \
            -H 'Content-Type: application/json' -d '{"text":"Fantastic services"}'
